name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Python tests
        run: |
          python -m pip install -r replayer/requirements.txt
          python -m pytest replayer/tests batch/test_metrics.py
      - name: Flink unit tests
        run: mvn -B -f flink-jobs/pom.xml test
